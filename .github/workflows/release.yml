name: Release

# Releases run here rather than on a laptop. npm trusted publishing (OIDC)
# lets this workflow publish without an npm token or a one-time password: the
# package's trusted publisher on npmjs.com names this file and the `npm`
# environment, and the environment only deploys from main. See RELEASE.md.
#
#   gh workflow run release.yml -f increment=minor
#   gh workflow run release.yml -f increment=minor -f dry_run=true
#
# A pull request that changes the release setup gets a dry run.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Print what the release would do, and change nothing
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .release-it.js

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry run
    # Pull requests from forks can't check out their branch from this repo.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # lerna-changelog reads the merged pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The changelog is built from the history since the last tag.
          fetch-depth: 0

      # Node from .mise.toml
      - name: Setup mise
        uses: jdx/mise-action@v5.2.5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # A pull request checks out its merge commit on a detached HEAD, and
      # release-it needs a branch. Checking out the pull request's branch by
      # name instead lets CodeQL flag cache poisoning, so put a local branch
      # on the merge commit. It has no upstream, which a dry run doesn't need:
      # it pushes nothing.
      - name: Branch for release-it
        if: github.event_name == 'pull_request'
        run: git switch --create release-dry-run

      - name: Dry run
        run: npx release-it "$INCREMENT" --ci --dry-run --no-git.requireUpstream
        env:
          INCREMENT: ${{ inputs.increment || 'minor' }}
          GITHUB_AUTH: ${{ github.token }}

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    # npm's trusted publisher accepts only this environment, and the
    # environment only deploys from main.
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
      issues: write # release-it comments on the issues a release resolves
      pull-requests: write # and on the pull requests it includes
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main, not $GITHUB_REF."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node from .mise.toml. npm publishes to registry.npmjs.org, its default,
      # so there's no .npmrc to write.
      - name: Setup mise
        uses: jdx/mise-action@v5.2.5
        with:
          # Never restore a cache into a build that gets published.
          cache: false

      # Trusted publishing needs npm 11.5.1 or later. npm 12.2.1 fails to
      # publish with OIDC: it rejects the token that its OIDC step sets as an
      # unknown CLI flag (EUNKNOWNCONFIG), so stay on npm 11.
      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Bumps the version, publishes to npm (prepublishOnly tests and prepack
      # builds first), then commits, tags, pushes, and creates the GitHub
      # release.
      - name: Release
        run: npx release-it "$INCREMENT" --ci
        env:
          INCREMENT: ${{ inputs.increment }}
          GITHUB_AUTH: ${{ github.token }}

      - name: Summary
        run: |
          version="$(jq -r .version package.json)"
          {
            echo "Released [v$version](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version)."
            echo "npm: https://www.npmjs.com/package/bintastic/v/$version"
          } >> "$GITHUB_STEP_SUMMARY"
